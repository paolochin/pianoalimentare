<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organizzazione Pasti 4.0</title>
    <style>
        /* CSS Reset and full viewport height configuration */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        /* Main View Container */
        #main-view {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            transition: transform 0.3s ease-in-out;
        }

        /* Category Buttons */
        .meal-btn {
            flex: 1;
            background-size: cover;
            background-position: center;
            border: none;
            position: relative;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        /* Dark overlay to ensure text contrast */
        .meal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
        }

        .meal-btn span {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: bold;
            font-size: 2.5rem;
        }

        /* Specific Button Backgrounds */
        #btn-colazione { background-image: url('https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=800&q=80'); }
        #btn-pranzo { background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&q=80'); }
        #btn-spuntino { background-image: url('https://images.unsplash.com/photo-1604423043492-4138e5b58e5f?w=800&q=80'); }
        #btn-cena { background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800&q=80'); }

        /* Floating Action Button for Substitutions */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 5;
        }

        /* Detail View Container */
        #detail-view {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100vw;
            height: 100vh;
            background-color: #1e1e1e;
            transition: transform 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #detail-view.active {
            transform: translateX(-100%);
        }

        /* Detail Header */
        .detail-header {
            background-color: #2c2c2c;
            padding: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            margin-right: 15px;
            cursor: pointer;
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: bold;
            flex-grow: 1;
        }

        /* Controls Section (Toggle & Generator) */
        #controls-container {
            padding: 15px;
            background-color: #252525;
            display: none;
            justify-content: center;
        }

        .toggle-btn, .generate-btn {
            background-color: #4da6ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .toggle-btn.workout-active {
            background-color: #ff5252;
        }

        /* Recipes & Modules List */
        #recipe-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .recipe-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .recipe-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4da6ff;
        }

        .recipe-desc {
            font-size: 1rem;
            line-height: 1.4;
            color: #cccccc;
            white-space: pre-wrap;
        }

        /* Warning Badge for Fast Condiment */
        .warning-badge {
            background-color: #ff5252;
            color: white;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Loading Spinner */
        #loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: #888;
        }

        /* Modal View for Substitutions */
        #modal-sub {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        #sub-content {
            overflow-y: auto;
            flex: 1;
        }
        
        .sub-card {
            background-color: #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .sub-title {
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="main-view">
        <button class="meal-btn" id="btn-colazione" onclick="openCategory('Colazione')">
            <span>Colazione</span>
        </button>
        <button class="meal-btn" id="btn-pranzo" onclick="openCategory('Pranzo')">
            <span>Pranzo</span>
        </button>
        <button class="meal-btn" id="btn-spuntino" onclick="openCategory('Spuntino')">
            <span>Spuntino</span>
        </button>
        <button class="meal-btn" id="btn-cena" onclick="openCategory('Cena')">
            <span>Cena</span>
        </button>
        <button class="fab" onclick="openSubstitutions()">Sostituzioni Grassi</button>
    </div>

    <div id="detail-view">
        <div class="detail-header">
            <button class="back-btn" onclick="closeCategory()">&#8592;</button>
            <div class="detail-title" id="current-category">Category</div>
        </div>
        
        <div id="controls-container">
            </div>

        <div id="loader">Loading data...</div>
        <div id="recipe-list"></div>
    </div>

    <div id="modal-sub">
        <div class="modal-header">
            <h2>Tabella Sostituzioni</h2>
            <button class="close-modal" onclick="closeSubstitutions()">&times;</button>
        </div>
        <div id="sub-content">Caricamento in corso...</div>
    </div>

	<script>
        // REQUIRED: Insert your deployed Google Apps Script Web App URL here
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw3rZ_BXO2QMNzKy36v60iq11_vDuwY08-r0Kp1ZotuqjH-8e1PPwJzXAJbO7Y0xXZ0/exec';

        // Global State Variables
        let currentData = null;
        let isWorkoutDay = false;

        // UI Navigation functions
        function openCategory(categoryName) {
            document.getElementById('current-category').innerText = categoryName;
            document.getElementById('detail-view').classList.add('active');
            
            const controls = document.getElementById('controls-container');
            controls.style.display = 'none';
            controls.innerHTML = '';
            
            fetchData(categoryName);
        }

        function closeCategory() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('recipe-list').innerHTML = '';
            currentData = null;
        }

        function openSubstitutions() {
            document.getElementById('modal-sub').style.display = 'flex';
            fetchSubstitutions();
        }

        function closeSubstitutions() {
            document.getElementById('modal-sub').style.display = 'none';
        }

        // Fetch primary data from Google Apps Script via HTTP REST
        async function fetchData(sheetName) {
            const loader = document.getElementById('loader');
            const recipeList = document.getElementById('recipe-list');
            
            loader.style.display = 'block';
            recipeList.innerHTML = '';

            try {
                const response = await fetch(`${WEB_APP_URL}?action=getSheetData&sheetName=${encodeURIComponent(sheetName)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                loader.style.display = 'none';
                currentData = data;
                handleDataRender(sheetName, data);

            } catch (error) {
                loader.style.display = 'none';
                console.error('Fetch error:', error);
                recipeList.innerHTML = '<p style="color: red;">Failed to load data from server. Check console.</p>';
            }
        }

        // Fetch substitution data via HTTP REST
        async function fetchSubstitutions() {
            const subContent = document.getElementById('sub-content');
            subContent.innerHTML = 'Caricamento in corso...';

            try {
                const response = await fetch(`${WEB_APP_URL}?action=getSubstitutionsData`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                renderSubstitutions(data);

            } catch (error) {
                console.error('Fetch error:', error);
                subContent.innerHTML = '<p style="color:red;">Failed to load substitutions from server.</p>';
            }
        }

        // Route data to correct rendering logic based on category type
        function handleDataRender(sheetName, data) {
            const controls = document.getElementById('controls-container');
            
            if (data.isModular) {
                // Lunch & Dinner Logic
                controls.style.display = 'flex';
                controls.innerHTML = '<button class="generate-btn" onclick="generateRandomMeal()">&#127851; Genera Combinazione Casuale</button>';
                generateRandomMeal(); // Initial generation
            } else if (sheetName === 'Spuntino') {
                // Snack Logic with Workout Toggle
                controls.style.display = 'flex';
                controls.innerHTML = `<button class="toggle-btn" id="workout-toggle" onclick="toggleWorkout()">Giorno di Riposo (Mostra Standard)</button>`;
                isWorkoutDay = false; // default state
                renderStandardRecipes(data.recipes);
            } else {
                // Breakfast Logic
                renderStandardRecipes(data.recipes);
            }
        }

        // Modular Logic: Generate Random combination from arrays
        function generateRandomMeal() {
            if (!currentData || !currentData.isModular) return;
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            const data = currentData;
            
            // Random index picker
            const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            if (!data.carbs || data.carbs.length === 0) {
                container.innerHTML = '<p>Nessun modulo trovato nel foglio.</p>';
                return;
            }

            const selectedCarb = getRandomItem(data.carbs);
            const selectedProtein = getRandomItem(data.proteins);
            const selectedFat = getRandomItem(data.fats);
            const selectedVeggie = getRandomItem(data.veggies);

            // Build UI for generated meal
            container.innerHTML = `
                <div class="recipe-card">
                    <div class="recipe-title">1. Fonte di Carboidrati (Primo)</div>
                    <div class="recipe-desc">${selectedCarb.name}</div>
                    ${selectedCarb.alert ? `<div class="warning-badge">${selectedCarb.alert}</div>` : ''}
                </div>
                <div class="recipe-card">
                    <div class="recipe-title">2. Fonte di Proteine (Secondo)</div>
                    <div class="recipe-desc">${selectedProtein || 'N/A'}</div>
                </div>
                <div class="recipe-card">
                    <div class="recipe-title">3. Grassi e Condimenti</div>
                    <div class="recipe-desc">${selectedFat || 'N/A'}</div>
                </div>
                <div class="recipe-card">
                    <div class="recipe-title">4. Verdure</div>
                    <div class="recipe-desc">${selectedVeggie || 'N/A'}</div>
                </div>
            `;
        }

        // Snack Logic: Toggle standard/workout views
        function toggleWorkout() {
            isWorkoutDay = !isWorkoutDay;
            const btn = document.getElementById('workout-toggle');
            
            if (isWorkoutDay) {
                btn.innerText = "Giorno di Allenamento (Mostra Pre/Post Workout)";
                btn.classList.add('workout-active');
            } else {
                btn.innerText = "Giorno di Riposo (Mostra Standard)";
                btn.classList.remove('workout-active');
            }
            
            renderStandardRecipes(currentData.recipes);
        }

        // Breakfast & Snack Logic: Render simple list
        function renderStandardRecipes(recipes) {
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            if (!recipes || recipes.length === 0) {
                container.innerHTML = '<p>Nessuna ricetta trovata.</p>';
                return;
            }

            let filteredRecipes = recipes;
            
            if (document.getElementById('current-category').innerText === 'Spuntino') {
                filteredRecipes = recipes.filter(r => {
                    const isWorkoutType = r.type && r.type.toLowerCase().includes('workout');
                    return isWorkoutDay ? isWorkoutType : !isWorkoutType;
                });
            }

            if (filteredRecipes.length === 0) {
                container.innerHTML = '<p>Nessuna opzione trovata per questa selezione.</p>';
                return;
            }

            filteredRecipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                let html = `<div class="recipe-title">${recipe.title}</div>
                            <div class="recipe-desc">${recipe.desc}</div>`;
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Render Substitution Table
        function renderSubstitutions(subItems) {
            const container = document.getElementById('sub-content');
            container.innerHTML = '';
            
            if (!subItems || subItems.length === 0) {
                container.innerHTML = '<p>Nessuna sostituzione trovata nel foglio.</p>';
                return;
            }

            subItems.forEach(item => {
                let html = `<div class="sub-card">
                                <div class="sub-title">${item.original}</div>
                                <ul style="color:#ccc; padding-left:20px;">`;
                
                item.alts.forEach(alt => {
                    if(alt) html += `<li>${alt}</li>`;
                });
                
                html += `</ul></div>`;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
